name: Public package checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pnpm install --frozen-lockfile
      - run: python -m pip install --only-binary=:all: -r requirements.txt
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm typecheck
      - run: pnpm test
        env:
          TRAILER_PYTHON: python
      - run: pnpm schema && pnpm types:generate && git diff --exit-code -- schemas src/tool-types.ts
      - run: pnpm exec tsc --noEmit --strict --module NodeNext --moduleResolution NodeNext --target ES2022 --skipLibCheck test/types.consumer.ts
      - run: pnpm pack --pack-destination artifacts/package
      - run: node scripts/package-smoke.ts artifacts/package/keel-trailer-0.2.0.tgz

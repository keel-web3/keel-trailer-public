<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>KEEL inspection</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101620;color:#e4ecf5;font:14px system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #354053}h1{font-size:20px;margin:0 0 8px}p{margin:6px 0;color:#aebed0}main{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,40%);gap:16px;padding:20px}section{min-width:0;background:#151e2b;padding:16px;border:1px solid #354053;border-radius:8px}label{display:inline-block;margin:0 8px 12px 0}select,input,button{background:#202d40;color:#e4ecf5;border:1px solid #526178;border-radius:4px;padding:7px}button{cursor:pointer}input{width:100%}canvas{display:block;width:100%;height:420px;background:#101620;touch-action:none}pre{white-space:pre-wrap;overflow-wrap:anywhere;max-height:520px;overflow:auto;font:12px ui-monospace,monospace}.gallery{display:flex;gap:8px;overflow:auto}.gallery figure{margin:0;min-width:180px;max-width:220px}.gallery img{width:100%}figcaption{font-size:12px;color:#aebed0}a{color:#71d7fa}#detail{min-height:40px}@media(max-width:800px){main{grid-template-columns:1fr}canvas{height:320px}}
</style>
<header><h1>KEEL data inspection</h1><p>Exact exported state. Drag a mesh to orbit; hover a grid or click a vertex/node to inspect its data.</p><a href="snapshot.json">Full snapshot JSON</a> · <a href="inspection.json">Report JSON</a></header>
<main><section><label>Object <select id="object"></select></label><label>Projection <select id="projection"><option>iso</option><option>front</option><option>top</option><option>side</option></select></label><label>Channel <select id="channel"></select></label><button id="reset">Reset view</button><canvas id="canvas" width="800" height="500"></canvas><p id="detail"></p><pre id="summary"></pre><div class="gallery" id="gallery"></div></section><section><label for="pointer">Code view · JSON pointer (RFC 6901)</label><input id="pointer" value="/state" spellcheck="false"><label>Array start <input id="start" type="number" min="0" value="0"></label><label>Count <input id="count" type="number" min="1" max="10000" value="100"></label><button id="query">Read data</button><pre id="code"></pre><p>Arrays paginate here; the saved snapshot retains every supplied value. Mesh views use local coordinates and indexed topology.</p></section></main>
<script type="application/json" id="payload">/*INSPECTION_PAYLOAD*/</script>
<script>
'use strict';const {snapshot,report}=JSON.parse(document.querySelector('#payload').textContent),$=s=>document.querySelector(s),canvas=$('#canvas'),ctx=canvas.getContext('2d');
const rows=[...(snapshot.meshes??[]).map((o,i)=>({kind:'mesh',o,i})),...(snapshot.graphs??[]).map((o,i)=>({kind:'graph',o,i})),...(snapshot.grids??[]).map((o,i)=>({kind:'grid',o,i}))];let current=null,points=[],angle=0,tilt=0,drag=null,gridRect=null;
const escaped=s=>s.replaceAll('~','~0').replaceAll('/','~1');function code(pointer){if(pointer!==undefined)$('#pointer').value=pointer;try{let value=snapshot;const p=$('#pointer').value;if(p!==''&&!p.startsWith('/'))throw Error('Use /field/array/index');for(const k of p===''?[]:p.slice(1).split('/').map(s=>s.replaceAll('~1','/').replaceAll('~0','~'))){if(value===null||typeof value!=='object'||!Object.hasOwn(value,k))throw Error('Unknown pointer');value=value[k];}if(Array.isArray(value)){const a=Math.max(0,Number($('#start').value)||0),n=Math.min(10000,Math.max(1,Number($('#count').value)||100));value={total:value.length,start:a,values:value.slice(a,a+n)};}const text=JSON.stringify(value,null,2);$('#code').textContent=text.length>200000?text.slice(0,200000)+'\n[display truncated; narrow the pointer or open snapshot.json]':text;}catch(e){$('#code').textContent=e.message;}}
function projection(p){let [x,y,z]=p.length===2?[p[0],0,p[1]]:p;const c=Math.cos(angle),s=Math.sin(angle),x1=x*c+z*s,z1=-x*s+z*c,y1=y*Math.cos(tilt)-z1*Math.sin(tilt),z2=y*Math.sin(tilt)+z1*Math.cos(tilt);switch($('#projection').value){case 'top':return [x1,z2];case 'side':return [z2,-y1];case 'front':return [x1,-y1];default:return [(x1-z2)*Math.SQRT1_2,(x1+z2)/Math.sqrt(6)-y1*Math.sqrt(2/3)];}}
function mapped(p){if(!p.length)return [];const q=p.map(projection),lo=[Infinity,Infinity],hi=[-Infinity,-Infinity];for(const v of q)for(let a=0;a<2;a++){lo[a]=Math.min(lo[a],v[a]);hi[a]=Math.max(hi[a],v[a]);}const sc=Math.min((canvas.width-60)/Math.max(1e-9,hi[0]-lo[0]),(canvas.height-60)/Math.max(1e-9,hi[1]-lo[1]));return q.map(v=>v.map((n,a)=>(n-(lo[a]+hi[a])/2)*sc+[canvas.width/2,canvas.height/2][a]));}
function line(p,color='#71d7fa'){if(p.length<2)return;ctx.strokeStyle=color;ctx.beginPath();ctx.moveTo(...p[0]);for(const v of p.slice(1))ctx.lineTo(...v);ctx.stroke();}
function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);points=[];gridRect=null;if(!current){$('#detail').textContent='State snapshot; use the code view.';return;}const {kind,o,i}=current;$('#summary').textContent=JSON.stringify(report.summaries[(kind==='mesh'?'meshes':kind+'s')].find(s=>s.id===o.id),null,2);
 if(kind==='mesh'){const p=[];for(let k=0;k<o.positions.length;k+=3)p.push(o.positions.slice(k,k+3));points=mapped(p);const n=o.indices.length/3,step=Math.max(1,Math.ceil(n/20000));for(let f=0;f<n;f+=step){const a=o.indices.slice(f*3,f*3+3).map(v=>points[v]);line([...a,a[0]]);}if(!n){ctx.fillStyle='#71d7fa';for(const pt of points){ctx.beginPath();ctx.arc(...pt,2,0,Math.PI*2);ctx.fill();}}$('#detail').textContent=`${p.length} exact vertices, ${n} indexed triangles${step>1?' · display samples triangles; raw JSON is complete':''}`;}
 else if(kind==='graph'){const n=o.nodes.length,p=o.nodes.map((v,k)=>v.position??[Math.cos(k/Math.max(1,n)*Math.PI*2),Math.sin(k/Math.max(1,n)*Math.PI*2)]);for(const e of o.edges)p.push(...(e.points??[]));const xy=mapped(p);points=xy.slice(0,n);const at=new Map(o.nodes.map((v,k)=>[v.id,points[k]]));let offset=n;for(const e of o.edges){const len=e.points?.length??0,vs=len?xy.slice(offset,offset+len):[at.get(e.from),at.get(e.to)];offset+=len;line(vs,'#65798f');if(e.directed&&vs.length>1){const [x,y]=vs.at(-1),[px,py]=vs.at(-2),a=Math.atan2(y-py,x-px);line([[x-10*Math.cos(a-.4),y-10*Math.sin(a-.4)],[x,y],[x-10*Math.cos(a+.4),y-10*Math.sin(a+.4)]],'#f9be62');}}for(let k=0;k<n;k++){ctx.fillStyle='#71d7fa';ctx.beginPath();ctx.arc(...points[k],4,0,Math.PI*2);ctx.fill();if(n<65){ctx.fillStyle='#e4ecf5';ctx.fillText(o.nodes[k].label??o.nodes[k].id,points[k][0]+7,points[k][1]);}}$('#detail').textContent=`${n} nodes · ${o.edges.length} edges · exported road paths retained`;}
 else{const key=$('#channel').value,a=o.channels[key];let lo=Infinity,hi=-Infinity;for(const v of a){lo=Math.min(lo,v);hi=Math.max(hi,v);}const image=new ImageData(o.width,o.height);for(let k=0;k<a.length;k++){const t=(a[k]-lo)/Math.max(1e-12,hi-lo);image.data.set([10+240*t,40+120*(1-t),30+210*(1-t),255],k*4);}const off=document.createElement('canvas');off.width=o.width;off.height=o.height;off.getContext('2d').putImageData(image,0,0);const s=Math.min((canvas.width-40)/o.width,(canvas.height-40)/o.height),w=o.width*s,h=o.height*s,x=(canvas.width-w)/2,y=(canvas.height-h)/2;ctx.imageSmoothingEnabled=false;ctx.drawImage(off,x,y,w,h);gridRect={x,y,w,h};$('#detail').textContent=`${o.width} × ${o.height} · ${key} · ${lo} … ${hi}`;}}
function choose(){current=rows[Number($('#object').value)]??null;angle=tilt=0;$('#channel').replaceChildren();if(current?.kind==='grid')for(const k of Object.keys(current.o.channels)){const option=new Option(k,k);$('#channel').append(option);}$('#channel').disabled=current?.kind!=='grid';if(current)code('/'+(current.kind==='mesh'?'meshes':current.kind+'s')+'/'+current.i);draw();}
for(const [i,r] of rows.entries())$('#object').append(new Option(r.kind+' · '+r.o.id,String(i)));$('#object').onchange=choose;$('#projection').onchange=draw;$('#channel').onchange=draw;$('#reset').onclick=()=>{angle=tilt=0;draw();};$('#query').onclick=()=>code();$('#pointer').onkeydown=e=>{if(e.key==='Enter')code();};
const xy=e=>{const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*canvas.width/r.width,(e.clientY-r.top)*canvas.height/r.height];};
canvas.onpointerdown=e=>{const p=xy(e);drag={p,start:p};canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{const p=xy(e);if(drag&&current?.kind==='mesh'){angle+=(p[0]-drag.p[0])*.008;tilt+=(p[1]-drag.p[1])*.008;drag.p=p;draw();}if(gridRect&&current){const r=gridRect,x=Math.floor((p[0]-r.x)/r.w*current.o.width),y=Math.floor((p[1]-r.y)/r.h*current.o.height);if(x>=0&&x<current.o.width&&y>=0&&y<current.o.height){const k=y*current.o.width+x;$('#detail').textContent=JSON.stringify({x,y,index:k,values:Object.fromEntries(Object.entries(current.o.channels).map(([c,a])=>[c,a[k]]))});code('/grids/'+current.i+'/channels/'+escaped($('#channel').value)+'/'+k);}}};
canvas.onpointerup=e=>{const p=xy(e),was=drag;drag=null;if(!was||Math.hypot(p[0]-was.start[0],p[1]-was.start[1])>5||!current||!points.length)return;let nearest=0,dist=Infinity;points.forEach((v,k)=>{const d=Math.hypot(v[0]-p[0],v[1]-p[1]);if(d<dist){nearest=k;dist=d;}});if(dist>30)return;if(current.kind==='graph')code('/graphs/'+current.i+'/nodes/'+nearest);else{const m=current.o,n=m.positions.length/3;$('#code').textContent=JSON.stringify({vertex:nearest,position:m.positions.slice(nearest*3,nearest*3+3),attributes:Object.fromEntries(Object.entries(m.attributes??{}).map(([k,a])=>[k,a.slice(nearest*(a.length/n),(nearest+1)*(a.length/n))]))},null,2);$('#pointer').value='/meshes/'+current.i+'/positions';$('#start').value=nearest*3;$('#count').value=3;}};
for(const v of report.views){const fig=document.createElement('figure'),img=new Image(),cap=document.createElement('figcaption');img.src=v.path.split('/').at(-1);img.alt=v.id;if(v.kind==='grid')img.style.imageRendering='pixelated';cap.textContent=v.id;fig.append(img,cap);$('#gallery').append(fig);}choose();code();
</script></html>

<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>KEEL snapshots</title><style>*{box-sizing:border-box}body{margin:24px;background:#101620;color:#e4ecf5;font:14px system-ui}h1{font-size:20px}a{color:#71d7fa}button,select{padding:8px;background:#202d40;color:white;border:1px solid #526178;border-radius:4px}main{display:grid;grid-template-columns:minmax(0,2fr) minmax(280px,1fr);gap:20px;margin-top:16px}#frame{max-width:100%;max-height:70vh;image-rendering:pixelated;background:#05080d}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace}.grid{display:flex;gap:10px;overflow:auto;margin-top:18px}.grid img{height:110px;image-rendering:pixelated;cursor:pointer}p{color:#aebed0}@media(max-width:700px){main{grid-template-columns:1fr}}</style><h1>KEEL frame and region inspection</h1><p>Saved source frames, named regions and exact pixel metadata.</p><a href="snapshots.json">Code view JSON</a> · <a href="snapshots-sheet.png">Contact sheet</a><p><button id="previous">Previous</button> <select id="select"></select> <button id="next">Next</button></p><main><div><img id="frame" alt="Selected source frame"></div><pre id="data"></pre></main><div class="grid" id="gallery"></div><script id="payload" type="application/json">/*MEDIA_PAYLOAD*/</script><script>
'use strict';const data=JSON.parse(document.querySelector('#payload').textContent),$=s=>document.querySelector(s);let index=0;function show(i){index=Math.max(0,Math.min(data.stills.length-1,i));$('#select').value=index;const row=data.stills[index];$('#frame').src=row.image;$('#frame').alt=`Frame ${row.frame} · ${row.view}`;$('#data').textContent=JSON.stringify(row,null,2);}for(const [i,row] of data.stills.entries()){$('#select').append(new Option(`Frame ${row.frame} · ${row.seconds?.toFixed(3)} s · ${row.view}`,i));const im=new Image();im.src=row.image;im.alt=row.view;im.onclick=()=>show(i);$('#gallery').append(im);}$('#select').onchange=()=>show(Number($('#select').value));$('#previous').onclick=()=>show(index-1);$('#next').onclick=()=>show(index+1);document.onkeydown=e=>{if(e.target.tagName==='SELECT')return;if(e.key==='ArrowLeft')show(index-1);if(e.key==='ArrowRight')show(index+1);};show(0);
</script></html>
